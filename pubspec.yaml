name: noteflow
description: "Noteflow — offline-first, privacy-focused note app. Import files as canvas, annotate, autosave, version history."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local database
  drift: ^2.20.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # PDF + file import
  pdfrx: ^2.2.0
  file_picker: ^8.1.2
  mime: ^1.0.6

  # Security (encryption-ready)
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Helpers
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.7+1
  pdf: ^3.13.0
  share_plus: ^12.0.2
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
